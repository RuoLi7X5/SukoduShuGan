<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F86F7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  
  <!-- Background: Rounded Blue Square -->
  <rect width="128" height="128" rx="36" fill="url(#blue-gradient)" />
  
  <!-- Icon: Grid 3x3 (White) -->
  <g transform="translate(24, 24)" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Border -->
    <rect x="0" y="0" width="80" height="80" rx="8" />
    <!-- Horizontal Lines -->
    <line x1="0" y1="26.66" x2="80" y2="26.66" />
    <line x1="0" y1="53.33" x2="80" y2="53.33" />
    <!-- Vertical Lines -->
    <line x1="26.66" y1="0" x2="26.66" y2="80" />
    <line x1="53.33" y1="0" x2="53.33" y2="80" />
  </g>
</svg>
